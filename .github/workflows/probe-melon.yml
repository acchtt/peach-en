name: Probe public Melon chart (demo only)
on:
  push:
    branches: [demo/automatic-chart-collection]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3
      - name: Probe public Melon TOP100 (dry run)
        run: python scripts/collect_melon.py --dry-run
      - name: Validate existing data
        run: python scripts/validate_data.py
