name: Deploy IVE RADAR to GitHub Pages
on:
  push:
    branches: [master]
  schedule:
    # UTC minute 13, once per hour. Delays are possible.
    - cron: '13 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python for collection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official YouTube MV views
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: python3 scripts/collect_youtube.py
      - name: Collect Apple Music KR Top Songs RSS
        run: python3 scripts/collect_apple_kr.py
      - name: Validate chart and streaming observations
        run: python3 scripts/validate_data.py
      - name: Check JavaScript syntax
        run: node --check stats.js
      - name: Commit new chart or streaming data if present
        id: update
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new verified data to publish."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data.json
            git commit -m 'data: Update official IVE music statistics'
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Bot-authored GITHUB_TOKEN pushes do not trigger other workflows:
      # deploy in this scheduled run when data.json changed.
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.update.outputs.changed == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.update.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
