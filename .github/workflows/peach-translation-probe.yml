name: Peach UI translation coverage probe
on:
  push:
    branches: ["feature/english-complete-audit"]
    paths: [".github/workflows/peach-translation-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Translate source UI copy using public translation gateway
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, json
          examples=['媒体库扫描完成','请在媒体库设置中添加目录并扫描。','当前筛选下没有更新']
          results=[]
          for text in examples:
            q=urllib.parse.urlencode(dict(client='gtx',sl='zh-CN',tl='en',dt='t',q=text))
            req=urllib.request.Request('https://translate.googleapis.com/translate_a/single?'+q,headers={'User-Agent':'Mozilla/5.0'})
            try:
              with urllib.request.urlopen(req,timeout=12) as f:
                a=json.load(f)
              results.append([text,''.join(k[0] for k in a[0] if k[0])])
            except Exception as exc:
              results.append([text,'ERROR '+type(exc).__name__+' '+str(exc)[:200]])
          with open('translation-probe.json','w',encoding='utf-8') as f:json.dump(results,f,ensure_ascii=False,indent=2)
          print(results)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: peach-translation-probe
          path: translation-probe.json
